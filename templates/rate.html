<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rate Driver - TaxiApp</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .card {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .info {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .stars {
            display: flex;
            gap: 8px;
            margin: 15px 0;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 35px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>⭐ Rate Driver</h1>

    <div class="info">

        <p>
            <b>Booking:</b>
            {{ booking["booking_id"] }}
        </p>

        <p>
            <b>Driver:</b>
            {{ booking["driver_name"] }}
        </p>

        <p>
            <b>Pickup:</b>
            {{ booking["pickup"] }}
        </p>

        <p>
            <b>Destination:</b>
            {{ booking["destination"] }}
        </p>

    </div>

    <form method="POST">

        <b>Rating:</b>

        <div class="stars">

            <input type="radio"
                   name="rating"
                   value="1"
                   id="star1"
                   required>

            <label for="star1">⭐</label>

            <input type="radio"
                   name="rating"
                   value="2"
                   id="star2">

            <label for="star2">⭐</label>

            <input type="radio"
                   name="rating"
                   value="3"
                   id="star3">

            <label for="star3">⭐</label>

            <input type="radio"
                   name="rating"
                   value="4"
                   id="star4">

            <label for="star4">⭐</label>

            <input type="radio"
                   name="rating"
                   value="5"
                   id="star5">

            <label for="star5">⭐</label>

        </div>

        <textarea
            name="review"
            placeholder="Driver ke baare mein review likho..."></textarea>

        <button type="submit">
            ⭐ SUBMIT RATING
        </button>

    </form>

    <a href="{{ url_for('customer_dashboard') }}">
        🔙 Back to Dashboard
    </a>

</div>

</body>
</html>
